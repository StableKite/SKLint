name: Build and publish SKLint to devpi

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  PACKAGE_VERSION: "0.1.52"
  PYTHON_JIT: "1"
  RUST_TOOLCHAIN: "1.98.0"
  EXPECTED_RUSTC: "rustc 1.98.0 (88d9e12ae 2026-08-18)"
  DEVPI_SERVER: "https://stablekite.com:4438/"
  DEVPI_TARGET_INDEX: "https://stablekite.com:4438/StableKite/index/"

jobs:
  windows_x86_64:
    name: Windows x86_64 / native wheel and canonical sdist validation
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up CI Python
        uses: ./.github/actions/setup-ci-python
      - name: Verify package versions
        shell: pwsh
        run: python .github/scripts/ci_sklint.py verify-versions
      - name: Install exact Rust toolchain
        shell: pwsh
        run: |
          rustup set profile minimal
          rustup toolchain install $env:RUST_TOOLCHAIN --component rustfmt --component clippy
          rustup default $env:RUST_TOOLCHAIN
          $actual = (rustc --version).Trim()
          Write-Host $actual
          if ($actual -ne $env:EXPECTED_RUSTC) { throw "Unexpected rustc: $actual" }
      - name: Prepare provenance environment
        shell: pwsh
        run: |
          $sha = (python .github/scripts/ci_sklint.py source-manifest --output "$env:RUNNER_TEMP\SOURCE_MANIFEST.txt").Trim()
          "SKLINT_SOURCE_TREE_SHA256=$sha" >> $env:GITHUB_ENV
          "SKLINT_SOURCE_COMMIT=$env:GITHUB_SHA" >> $env:GITHUB_ENV
          "SKLINT_SOURCE_DIRTY=false" >> $env:GITHUB_ENV
          "SKLINT_BUILD_VERSION=$env:PACKAGE_VERSION" >> $env:GITHUB_ENV
          "SKLINT_BUILD_REVISION=v$env:PACKAGE_VERSION" >> $env:GITHUB_ENV
          "SKLINT_CARGO_PROFILE=release" >> $env:GITHUB_ENV
          "SKLINT_WHEEL_PLATFORM_TAG=win_amd64" >> $env:GITHUB_ENV
      - name: Audits and locked Rust gates
        shell: pwsh
        run: |
          python scripts/audit-rule-docs.py
          python scripts/audit-fix-coverage.py
          python scripts/audit-pydoclint-port.py
          cargo fmt --all -- --check
          cargo test --workspace --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo build --release --locked -p sklint
      - name: Build Windows wheel and canonical sdist
        shell: pwsh
        run: |
          python -m pip install --upgrade pip build wheel twine
          if (Test-Path dist) { Remove-Item dist -Recurse -Force }
          python -m build --wheel --sdist --outdir dist
          python .github/scripts/ci_sklint.py verify-dist --dir dist --platform-tag win_amd64 --expect-sdist
          python -m twine check dist/*
      - name: Verify Windows provenance
        shell: pwsh
        run: python .github/scripts/ci_sklint.py verify-provenance --binary target/release/sklint.exe --target x86_64-pc-windows-msvc
      - name: Installed-package smoke
        shell: pwsh
        run: |
          if (Test-Path verify-venv) { Remove-Item verify-venv -Recurse -Force }
          python -m venv verify-venv
          .\verify-venv\Scripts\python.exe .github/scripts/ci_python_policy.py --verify
          $wheel = Get-ChildItem dist -Filter "sklint-$env:PACKAGE_VERSION-py3-none-win_amd64.whl"
          if (@($wheel).Count -ne 1) { throw "Unexpected Windows wheel set" }
          .\verify-venv\Scripts\python.exe -m pip install --no-index --no-deps $wheel[0].FullName
          .\verify-venv\Scripts\python.exe .github/scripts/ci_sklint.py smoke
      - name: Build and smoke Windows VSIX
        shell: pwsh
        run: |
          Push-Location vscode
          npm ci
          npm run compile
          Pop-Location
          python scripts/package-vscode.py
          $vsix = "dist/sklint-$env:PACKAGE_VERSION.vsix"
          if (-not (Test-Path $vsix)) { throw "VSIX was not produced: $vsix" }
          $extract = Join-Path $env:RUNNER_TEMP "vsix-win"
          if (Test-Path $extract) { Remove-Item $extract -Recurse -Force }
          python -c "import sys,zipfile; zipfile.ZipFile(sys.argv[1]).extractall(sys.argv[2])" $vsix $extract
          python .github/scripts/ci_sklint.py verify-provenance --binary "$extract/extension/bin/win32-x64/sklint.exe" --target x86_64-pc-windows-msvc
          if (git status --porcelain) { throw "Tracked files changed during Windows validation" }
      - name: Upload Windows distributions
        uses: actions/upload-artifact@v7
        with:
          name: sklint-dist-windows-x86_64
          if-no-files-found: error
          path: |
            dist/sklint-${{ env.PACKAGE_VERSION }}-py3-none-win_amd64.whl
            dist/sklint-${{ env.PACKAGE_VERSION }}.tar.gz
      - name: Upload Windows VSIX
        uses: actions/upload-artifact@v7
        with:
          name: sklint-vsix-windows-x86_64
          if-no-files-found: error
          path: dist/sklint-${{ env.PACKAGE_VERSION }}.vsix

  glibc_x86_64:
    name: Linux glibc x86_64 / native wheel and full release validation
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up CI Python
        uses: ./.github/actions/setup-ci-python
      - name: Verify package versions
        run: python .github/scripts/ci_sklint.py verify-versions
      - name: Install exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup set profile minimal
          rustup toolchain install "$RUST_TOOLCHAIN" --component rustfmt --component clippy
          rustup default "$RUST_TOOLCHAIN"
          test "$(rustc --version)" = "$EXPECTED_RUSTC"
      - name: Prepare provenance environment
        shell: bash
        run: |
          set -euo pipefail
          sha="$(python .github/scripts/ci_sklint.py source-manifest --output "$RUNNER_TEMP/SOURCE_MANIFEST.txt")"
          {
            echo "SKLINT_SOURCE_TREE_SHA256=$sha"
            echo "SKLINT_SOURCE_COMMIT=$GITHUB_SHA"
            echo "SKLINT_SOURCE_DIRTY=false"
            echo "SKLINT_BUILD_VERSION=$PACKAGE_VERSION"
            echo "SKLINT_BUILD_REVISION=v$PACKAGE_VERSION"
            echo "SKLINT_CARGO_PROFILE=release"
            echo "SKLINT_WHEEL_PLATFORM_TAG=manylinux_2_35_x86_64"
          } >> "$GITHUB_ENV"
      - name: Locked Rust gates and complete release checks
        shell: bash
        env:
          PYTHON: python
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo test --workspace --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo build --release --locked -p sklint
          bash scripts/check-release.sh
      - name: Preserve and verify Linux x86_64 VSIX
        shell: bash
        run: |
          set -euo pipefail
          vsix="dist/sklint-${PACKAGE_VERSION}.vsix"
          test -f "$vsix"
          cp "$vsix" "$RUNNER_TEMP/sklint-${PACKAGE_VERSION}-linux-x86_64.vsix"
          rm -rf "$RUNNER_TEMP/vsix-linux"
          python - "$vsix" "$RUNNER_TEMP/vsix-linux" <<'PY'
          import os
          import sys
          import zipfile

          vsix, destination = sys.argv[1:]
          member = "extension/bin/linux-x64/sklint"
          with zipfile.ZipFile(vsix) as archive:
              info = archive.getinfo(member)
              mode = (info.external_attr >> 16) & 0o777
              if not mode & 0o111:
                  raise SystemExit(f"VSIX binary is not executable in archive metadata: mode={mode:o}")
              archive.extractall(destination)
          binary = os.path.join(destination, member)
          os.chmod(binary, os.stat(binary).st_mode | 0o111)
          PY
          python .github/scripts/ci_sklint.py verify-provenance --binary "$RUNNER_TEMP/vsix-linux/extension/bin/linux-x64/sklint" --target x86_64-unknown-linux-gnu
          test -z "$(git status --porcelain)"
      - name: Build glibc x86_64 wheel and enforce GLIBC ceiling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y binutils
          python -m pip install --upgrade pip build wheel twine
          rm -rf dist
          python -m build --wheel --outdir dist
          python .github/scripts/ci_sklint.py verify-dist --dir dist --platform-tag manylinux_2_35_x86_64
          python -m twine check dist/*
          bin=target/release/sklint
          test -x "$bin"
          max_glibc="$(readelf --version-info "$bin" | grep -oE 'GLIBC_[0-9]+(\.[0-9]+)*' | sort -Vu | tail -n1 || true)"
          test -n "$max_glibc"
          number="${max_glibc#GLIBC_}"
          test "$(printf '%s\n%s\n' "$number" '2.35' | sort -V | head -n1)" = "$number"
          echo "max_glibc=$max_glibc"
          python .github/scripts/ci_sklint.py verify-provenance --binary "$bin" --target x86_64-unknown-linux-gnu
      - name: Installed-package smoke
        shell: bash
        run: |
          set -euo pipefail
          rm -rf verify-venv
          python -m venv verify-venv
          verify-venv/bin/python .github/scripts/ci_python_policy.py --verify
          verify-venv/bin/python -m pip install --no-index --no-deps "dist/sklint-${PACKAGE_VERSION}-py3-none-manylinux_2_35_x86_64.whl"
          verify-venv/bin/python .github/scripts/ci_sklint.py smoke
          test -z "$(git status --porcelain)"
      - name: Upload glibc x86_64 wheel
        uses: actions/upload-artifact@v7
        with:
          name: sklint-dist-glibc-x86_64
          if-no-files-found: error
          path: dist/sklint-${{ env.PACKAGE_VERSION }}-py3-none-manylinux_2_35_x86_64.whl
      - name: Upload Linux x86_64 VSIX
        uses: actions/upload-artifact@v7
        with:
          name: sklint-vsix-linux-x86_64
          if-no-files-found: error
          path: ${{ runner.temp }}/sklint-${{ env.PACKAGE_VERSION }}-linux-x86_64.vsix

