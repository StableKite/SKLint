        with:
          name: sklint-dist-glibc-aarch64
          if-no-files-found: error
          path: dist/sklint-${{ env.PACKAGE_VERSION }}-py3-none-manylinux_2_35_aarch64.whl

  musl_x86_64:
    name: Linux musl x86_64 / native wheel validation
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build and validate in Alpine 3.24
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -e PACKAGE_VERSION -e PYTHON_JIT -e GITHUB_SHA -e RUST_TOOLCHAIN -e EXPECTED_RUSTC \
            -v "$PWD:/src" -w /src alpine:3.24 sh -euxc '
              apk add --no-cache bash curl ca-certificates libstdc++ jq build-base musl-dev linux-headers git
              curl -LsSf https://astral.sh/uv/install.sh | sh
              export PATH="/root/.local/bin:$PATH"
              LATEST_VERSION="$(
                uv python list ">=3.14+freethreaded" --all-versions --only-downloads --output-format json |
                jq -r "[.[] | select(.implementation == \"cpython\") | select(.variant == \"freethreaded\") | select(.version | test(\"^[0-9]+\\\\.[0-9]+\\\\.[0-9]+$\")) | .version] | sort_by(split(\".\") | map(tonumber)) | last // empty"
              )"
              test -n "$LATEST_VERSION"
              LATEST_SPEC="${LATEST_VERSION}+freethreaded"
              echo "Latest stable free-threaded candidate: $LATEST_SPEC"
              uv python install "$LATEST_SPEC"
              rm -rf /tmp/venv
              uv venv --python "$LATEST_SPEC" --managed-python --seed /tmp/venv
              export PATH="/tmp/venv/bin:/root/.local/bin:$PATH"
              export PYTHON_JIT=1
              python .github/scripts/ci_python_policy.py --verify
              python .github/scripts/ci_sklint.py verify-versions
              curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal --default-toolchain "$RUST_TOOLCHAIN"
              export PATH="$HOME/.cargo/bin:$PATH"
              rustup component add rustfmt clippy --toolchain "$RUST_TOOLCHAIN"
              test "$(rustc --version)" = "$EXPECTED_RUSTC"
              tree_sha="$(python .github/scripts/ci_sklint.py source-manifest --output /tmp/SOURCE_MANIFEST.txt)"
              export SKLINT_SOURCE_TREE_SHA256="$tree_sha"
              export SKLINT_SOURCE_COMMIT="$GITHUB_SHA"
              export SKLINT_SOURCE_DIRTY=false
              export SKLINT_BUILD_VERSION="$PACKAGE_VERSION"
              export SKLINT_BUILD_REVISION="v$PACKAGE_VERSION"
              export SKLINT_CARGO_PROFILE=release
              export SKLINT_WHEEL_PLATFORM_TAG=musllinux_1_2_x86_64
              python scripts/audit-rule-docs.py
              python scripts/audit-fix-coverage.py
              python scripts/audit-pydoclint-port.py
              cargo fmt --all -- --check
              cargo test --workspace --locked
              cargo clippy --workspace --all-targets --locked -- -D warnings
              cargo build --release --locked -p sklint
              rm -rf dist
              python -m pip install --upgrade build wheel twine
              python -m build --wheel --outdir dist
              python .github/scripts/ci_sklint.py verify-dist --dir dist --platform-tag musllinux_1_2_x86_64
              python -m twine check dist/*
              python .github/scripts/ci_sklint.py verify-provenance --binary target/release/sklint --target x86_64-unknown-linux-musl
              rm -rf /tmp/verify
              uv venv --python "$LATEST_SPEC" --managed-python --seed /tmp/verify
              PYTHON_JIT=1 /tmp/verify/bin/python .github/scripts/ci_python_policy.py --verify
              /tmp/verify/bin/python -m pip install --no-index --no-deps "dist/sklint-${PACKAGE_VERSION}-py3-none-musllinux_1_2_x86_64.whl"
              /tmp/verify/bin/python .github/scripts/ci_sklint.py smoke
              test -z "$(git status --porcelain)"
              chmod -R a+rX dist
            '
      - name: Upload musl x86_64 wheel
        uses: actions/upload-artifact@v7
        with:
          name: sklint-dist-musl-x86_64
          if-no-files-found: error
          path: dist/sklint-${{ env.PACKAGE_VERSION }}-py3-none-musllinux_1_2_x86_64.whl

