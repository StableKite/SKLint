              cargo build --release --locked -p sklint
              rm -rf dist
              python -m pip install --upgrade build wheel twine
              python -m build --wheel --outdir dist
              python .github/scripts/ci_sklint.py verify-dist --dir dist --platform-tag musllinux_1_2_aarch64
              python -m twine check dist/*
              python .github/scripts/ci_sklint.py verify-provenance --binary target/release/sklint --target aarch64-unknown-linux-musl
              rm -rf /tmp/verify
              uv venv --python "$LATEST_SPEC" --managed-python --seed /tmp/verify
              PYTHON_JIT=1 /tmp/verify/bin/python .github/scripts/ci_python_policy.py --verify
              /tmp/verify/bin/python -m pip install --no-index --no-deps "dist/sklint-${PACKAGE_VERSION}-py3-none-musllinux_1_2_aarch64.whl"
              /tmp/verify/bin/python .github/scripts/ci_sklint.py smoke
              test -z "$(git status --porcelain)"
              chmod -R a+rX dist
            '
      - name: Upload musl aarch64 wheel
        uses: actions/upload-artifact@v7
        with:
          name: sklint-dist-musl-aarch64
          if-no-files-found: error
          path: dist/sklint-${{ env.PACKAGE_VERSION }}-py3-none-musllinux_1_2_aarch64.whl

  publish:
    name: Validate publication intent and publish the exact checked set
    runs-on: ubuntu-24.04
    needs:
      - windows_x86_64
      - glibc_x86_64
      - glibc_aarch64
      - musl_x86_64
      - musl_aarch64
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up CI Python
        uses: ./.github/actions/setup-ci-python
      - name: Verify package versions
        run: python .github/scripts/ci_sklint.py verify-versions
      - name: Install offline gate dependencies
        run: python -m pip install packaging requests
      - name: Check publication failure controls without credentials or production requests
        run: python -I .github/scripts/test_ci_publish.py
      - name: Determine fail-closed publication intent
        id: release
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python -I .github/scripts/ci_publish.py plan . "${{ runner.temp }}/sklint-publication"
      - name: Validation only; authentication, collision checks and uploads are skipped
        if: steps.release.outputs.should_publish != 'true'
        run: echo "Validation only. PLAN.json records the verified previous and current versions. No devpi credentials are used."
      - name: Authenticated collision check with separate read credential
        if: steps.release.outputs.should_publish == 'true'
        env:
          DEVPI_READ_TOKEN: ${{ secrets.DEVPI_READ_TOKEN }}
        run: python -I .github/scripts/ci_publish.py collision . "${{ runner.temp }}/sklint-publication"
      - name: Download the original distributions from this run
        if: steps.release.outputs.should_publish == 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: sklint-dist-*
          path: ${{ runner.temp }}/sklint-platform-distributions
          merge-multiple: true
      - name: Install upload tools only for an authorized publication
        if: steps.release.outputs.should_publish == 'true'
        run: python -m pip install twine==7.0.0 setuptools
      - name: Verify exact native artifacts and original installed-package integration
        if: steps.release.outputs.should_publish == 'true'
        run: python -I .github/scripts/ci_publish.py validate . "${{ runner.temp }}/sklint-publication" --artifacts "${{ runner.temp }}/sklint-platform-distributions"
      - name: Upload each checked original once using write-only credential
        if: steps.release.outputs.should_publish == 'true'
        env:
          DEVPI_TOKEN: ${{ secrets.DEVPI_TOKEN }}
        run: python -I .github/scripts/ci_publish.py upload . "${{ runner.temp }}/sklint-publication"
      - name: Confirm exact published file names, sizes and server bytes using read credential
        if: steps.release.outputs.should_publish == 'true'
        env:
          DEVPI_READ_TOKEN: ${{ secrets.DEVPI_READ_TOKEN }}
        run: python -I .github/scripts/ci_publish.py confirm . "${{ runner.temp }}/sklint-publication"
      - name: Preserve publication plan and original failure evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sklint-publication-receipts
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/sklint-publication/**
            !${{ runner.temp }}/sklint-publication/consumer/**
            !${{ runner.temp }}/sklint-publication/distributions/**
            !${{ runner.temp }}/sklint-publication/confirmed-downloads/**
