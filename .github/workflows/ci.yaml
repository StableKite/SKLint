              export PYTHON_JIT=1
              python .github/scripts/ci_python_policy.py --verify
              python .github/scripts/ci_sklint.py verify-versions
              curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal --default-toolchain "$RUST_TOOLCHAIN"
              export PATH="$HOME/.cargo/bin:$PATH"
              rustup component add rustfmt clippy --toolchain "$RUST_TOOLCHAIN"
              test "$(rustc --version)" = "$EXPECTED_RUSTC"
              tree_sha="$(python .github/scripts/ci_sklint.py source-manifest --output /tmp/SOURCE_MANIFEST.txt)"
              export SKLINT_SOURCE_TREE_SHA256="$tree_sha"
              export SKLINT_SOURCE_COMMIT="$GITHUB_SHA"
              export SKLINT_SOURCE_DIRTY=false
              export SKLINT_BUILD_VERSION="$PACKAGE_VERSION"
              export SKLINT_BUILD_REVISION="v$PACKAGE_VERSION"
              export SKLINT_CARGO_PROFILE=release
              export SKLINT_WHEEL_PLATFORM_TAG=musllinux_1_2_aarch64
              python scripts/audit-rule-docs.py
              python scripts/audit-fix-coverage.py
              python scripts/audit-pydoclint-port.py
              cargo fmt --all -- --check
              cargo test --workspace --locked
