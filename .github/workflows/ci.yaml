              export SKLINT_SOURCE_TREE_SHA256="$tree_sha"
              export SKLINT_SOURCE_COMMIT="$GITHUB_SHA"
              export SKLINT_SOURCE_DIRTY=false
              export SKLINT_BUILD_VERSION="$PACKAGE_VERSION"
              export SKLINT_BUILD_REVISION="v$PACKAGE_VERSION"
              export SKLINT_CARGO_PROFILE=release
              export SKLINT_WHEEL_PLATFORM_TAG=musllinux_1_2_aarch64
              python scripts/audit-rule-docs.py
              python scripts/audit-fix-coverage.py
