              python -m twine check dist/*
              python .github/scripts/ci_sklint.py verify-provenance --binary target/release/sklint --target aarch64-unknown-linux-musl
              rm -rf /tmp/verify
              uv venv --python "$LATEST_SPEC" --managed-python --seed /tmp/verify
              PYTHON_JIT=1 /tmp/verify/bin/python .github/scripts/ci_python_policy.py --verify
              /tmp/verify/bin/python -m pip install --no-index --no-deps "dist/sklint-${PACKAGE_VERSION}-py3-none-musllinux_1_2_aarch64.whl"
              /tmp/verify/bin/python .github/scripts/ci_sklint.py smoke
              test -z "$(git status --porcelain)"
              chmod -R a+rX dist
            '
      - name: Upload musl aarch64 wheel
        uses: actions/upload-artifact@v7
        with:
          name: sklint-dist-musl-aarch64
          if-no-files-found: error
          path: dist/sklint-${{ env.PACKAGE_VERSION }}-py3-none-musllinux_1_2_aarch64.whl

  publish:
    name: Publish platform-validated artifacts to devpi
    runs-on: ubuntu-24.04
    needs:
      - windows_x86_64
      - glibc_x86_64
      - glibc_aarch64
      - musl_x86_64
      - musl_aarch64
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up CI Python
        uses: ./.github/actions/setup-ci-python
      - name: Verify package versions
        run: python .github/scripts/ci_sklint.py verify-versions
      - name: Determine publish intent
        id: publish_intent
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          current_version="$(python - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as f:
              print(tomllib.load(f)["project"]["version"])
          PY
          )"
          if [ "$current_version" != "$PACKAGE_VERSION" ]; then
            echo "::error::PACKAGE_VERSION=$PACKAGE_VERSION does not match pyproject.toml version=$current_version"
            exit 1
          fi

          should_publish=false
          previous_version=""
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            should_publish=true
            echo "Manual workflow_dispatch: publication requested."
          elif [ "$EVENT_NAME" = "push" ]; then
            if [ -z "${BEFORE_SHA:-}" ] || [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
              echo "::error::Push event has no usable before SHA; refusing to infer publication intent."
              exit 1
            fi
            if ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
              echo "::error::Push before SHA is unavailable in checkout; refusing to infer publication intent."
              exit 1
            fi
            if ! git cat-file -e "${BEFORE_SHA}:pyproject.toml" 2>/dev/null; then
              echo "::error::Previous pyproject.toml is unavailable; refusing to infer publication intent."
              exit 1
            fi
            previous_version="$(git show "${BEFORE_SHA}:pyproject.toml" | python -c 'import sys,tomllib; print(tomllib.loads(sys.stdin.read())["project"]["version"])')"
            if [ "$previous_version" != "$current_version" ]; then
              should_publish=true
            fi
          else
            echo "::error::Unexpected event for publication intent: $EVENT_NAME"
            exit 1
          fi

          echo "previous_version=${previous_version:-unavailable}"
          echo "current_version=$current_version"
          echo "should_publish=$should_publish"
          echo "should_publish=$should_publish" >> "$GITHUB_OUTPUT"
      - name: Validation-only push; publication skipped
        if: steps.publish_intent.outputs.should_publish != 'true'
        shell: bash
        run: echo "Package version is unchanged; all platform validation passed and devpi publication is intentionally skipped."
      - name: Download platform distributions
        if: steps.publish_intent.outputs.should_publish == 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: sklint-dist-*
          path: dist
          merge-multiple: true
      - name: Verify exact publish set
        if: steps.publish_intent.outputs.should_publish == 'true'
        run: python .github/scripts/ci_sklint.py verify-publish-set --dir dist
      - name: Install publish tools
        if: steps.publish_intent.outputs.should_publish == 'true'
        run: python -m pip install --upgrade pip twine devpi-client devpi-tokens
      - name: Twine check
        if: steps.publish_intent.outputs.should_publish == 'true'
        run: python -m twine check dist/*
      - name: Authenticated collision check, integration and publish
        if: steps.publish_intent.outputs.should_publish == 'true'
        shell: bash
        env:
          DEVPI_TOKEN: ${{ secrets.DEVPI_TOKEN }}
          DEVPI_CLIENTDIR: ${{ runner.temp }}/devpi-client
          PIP_CONFIG_FILE: ${{ runner.temp }}/pip.conf
        run: |
          set -euo pipefail
          TOKEN_FILE="$(mktemp)"
          PROJECT_JSON="$(mktemp)"
          PROJECT_ERR="$(mktemp)"
          AFTER_JSON="$(mktemp)"
          cleanup() {
            rm -f "$TOKEN_FILE" "$PROJECT_JSON" "$PROJECT_ERR" "$AFTER_JSON" "$PIP_CONFIG_FILE"
            rm -rf "$DEVPI_CLIENTDIR"
          }
          trap cleanup EXIT
          if [ -z "${DEVPI_TOKEN:-}" ]; then
            echo "::error::DEVPI_TOKEN is not available to this repository."
            exit 1
          fi
          printf '%s' "$DEVPI_TOKEN" > "$TOKEN_FILE"
          chmod 600 "$TOKEN_FILE"
          devpi use "$DEVPI_SERVER"
          devpi token-login -f "$TOKEN_FILE"
          devpi use --set-cfg "$DEVPI_TARGET_INDEX"

          set +e
          devpi getjson /StableKite/index/sklint > "$PROJECT_JSON" 2> "$PROJECT_ERR"
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            PROJECT_JSON="$PROJECT_JSON" PACKAGE_VERSION="$PACKAGE_VERSION" python - <<'PY'
          import json, os, re
          from pathlib import Path
          expected = tuple(map(int, os.environ["PACKAGE_VERSION"].split(".")))
          data = json.loads(Path(os.environ["PROJECT_JSON"]).read_text())
          if not isinstance(data, dict):
              raise SystemExit("Unexpected devpi project JSON schema")
          payload = data.get("result", data)
          if not isinstance(payload, dict):
              raise SystemExit("Unexpected devpi project result schema")
          version_keys = [k for k in payload if re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", str(k))]
          if payload and not version_keys:
              raise SystemExit("Could not identify versions in devpi project JSON")
          versions = sorted(tuple(map(int, k.split("."))) for k in version_keys)
          bad = [v for v in versions if v >= expected]
          if bad:
              raise SystemExit(f"Refusing publish; devpi already has conflicting/newer versions: {bad}")
          print("Authenticated devpi collision check OK")
          PY
          else
            cat "$PROJECT_JSON" >&2 || true
            cat "$PROJECT_ERR" >&2 || true
            if grep -Eqi '(^|[[:space:]])404[[:space:]]+Not Found([:[:space:]]|$)' "$PROJECT_JSON" "$PROJECT_ERR"; then
              echo "Authenticated devpi project is not listed; release is collision-free."
            else
              echo "::error::Could not reliably inspect SKLint publication history on devpi."
              exit 1
            fi
          fi

          python -m pip install --no-deps --force-reinstall "dist/sklint-${PACKAGE_VERSION}-py3-none-manylinux_2_35_x86_64.whl"
          python .github/scripts/ci_python_policy.py --verify
          python -m pip check
          python .github/scripts/ci_sklint.py smoke

          devpi upload dist/*
          devpi getjson /StableKite/index/sklint > "$AFTER_JSON"
          AFTER_JSON="$AFTER_JSON" PACKAGE_VERSION="$PACKAGE_VERSION" python - <<'PY'
          import json, os
          from pathlib import Path
          version = os.environ["PACKAGE_VERSION"]
          data = json.loads(Path(os.environ["AFTER_JSON"]).read_text())
          if not isinstance(data, dict):
              raise SystemExit("Unexpected devpi confirmation JSON schema")
          payload = data.get("result", data)
          if not isinstance(payload, dict) or version not in payload:
              raise SystemExit(f"Published version {version} not confirmed by devpi")
          print(f"devpi publication confirmed: sklint {version}")
          PY
