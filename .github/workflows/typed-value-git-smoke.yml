name: Ordinary Linux Git consumer for typed exception values
on:
  push:
    branches: [engineering/typed-value-git-smoke-ci-v1]
permissions:
  contents: read
env:
  PYTHON_JIT: "1"
jobs:
  linux-git-consumer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify isolated controller scope
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          expected = {'.github/scripts/ci_typed_value_git.py', '.github/workflows/typed-value-git-smoke.yml'}
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', '25b0ef18b3ec3061d8c4371fb9982800229ccefe', 'HEAD'], text=True).splitlines())
          assert changed == expected, changed
          PY
      - name: Select the original stable free-threaded Python
        uses: ./.github/actions/setup-ci-python
      - name: Install the original exact Rust compiler
        shell: bash
        run: |
          rustup set profile minimal
          rustup toolchain install 1.98.0
          rustup default 1.98.0
          test "$(rustc --version)" = "rustc 1.98.0 (88d9e12ae 2026-08-18)"
      - name: Ordinary Git installation, original smoke and own regressions
        run: python -B .github/scripts/ci_typed_value_git.py "${{ runner.temp }}/typed-value-git"
      - name: Preserve native consumer receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: typed-value-linux-git-receipts
          path: ${{ runner.temp }}/typed-value-git/evidence
          if-no-files-found: error
