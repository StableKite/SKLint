name: SKLint 0.1.50 Linux release build

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Exact SKLint release commit SHA to build
        required: true
        type: string

permissions:
  contents: read

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            asset_arch: x64
            rust_target: x86_64-unknown-linux-gnu
            build_vsix: true
          - runner: ubuntu-22.04-arm
            asset_arch: arm64
            rust_target: aarch64-unknown-linux-gnu
            build_vsix: false

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref }}
          fetch-depth: 1

      - name: Verify exact release commit and clean tree
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected="${{ inputs.release_ref }}"
          echo "expected release commit: $expected"
          echo "actual checkout commit:  $actual"
          test "$actual" = "$expected"
          test "$actual" = "b528ab956efca25a25cb2665feffdb77b0dde55f"
          test -z "$(git status --porcelain)"

      - name: Install exact Rust 1.98.0
        shell: bash
        run: |
          set -euo pipefail
          rustup set profile minimal
          rustup toolchain install 1.98.0 --component rustfmt --component clippy
          rustup default 1.98.0
          rustc --version
          cargo --version
          rustfmt --version
          cargo clippy --version
          test "$(rustc --version)" = "rustc 1.98.0 (88d9e12ae 2026-08-18)"

      - name: Compute canonical release source tree
        id: source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          root = Path(".").resolve()
          excluded_dirs = {
              ".git",
              "target",
              "build",
              "dist",
              "candidate-dist",
              "release-dist",
              "__pycache__",
              "node_modules",
          }

          rows: list[str] = []
          for path in root.rglob("*"):
              if not path.is_file():
                  continue

              rel = path.relative_to(root)
              rel_posix = rel.as_posix()

              if any(
                  part in excluded_dirs or part.endswith(".egg-info")
                  for part in rel.parts
              ):
                  continue

              # These tracked public-repository paths are intentionally absent
              # from the verified canonical R10/release source package.
              if rel_posix.startswith("docs/reports/"):
                  continue
              if rel_posix.startswith("vscode/out/"):
                  continue

              data = path.read_bytes()
              rows.append(
                  f"{rel_posix}|{len(data)}|{hashlib.sha256(data).hexdigest()}"
              )

          rows.sort()
          manifest = "\n".join(rows) + "\n"
          Path("SOURCE_MANIFEST.txt").write_text(
              manifest,
              encoding="utf-8",
              newline="\n",
          )
          tree_sha = hashlib.sha256(manifest.encode("utf-8")).hexdigest()

          print(f"canonical-files={len(rows)}")
          print(f"source-tree-sha256={tree_sha}")

          if len(rows) != 56:
              raise SystemExit(f"expected 56 canonical files, got {len(rows)}")
          if tree_sha != "2ed1ee8f03674d3138adbc52103df239dc608bfa144fc48bb553adca14696101":
              raise SystemExit(f"unexpected canonical tree: {tree_sha}")

          Path("SOURCE_TREE_SHA.txt").write_text(
              tree_sha + "\n",
              encoding="ascii",
              newline="\n",
          )
          PY

          tree_sha="$(tr -d '\r\n' < SOURCE_TREE_SHA.txt)"
          echo "tree_sha=$tree_sha" >> "$GITHUB_OUTPUT"

      - name: Audits, tests, clippy and release build
        shell: bash
        env:
          SKLINT_BUILD_VERSION: "0.1.50"
          SKLINT_BUILD_REVISION: "v0.1.50"
          SKLINT_SOURCE_TREE_SHA256: ${{ steps.source.outputs.tree_sha }}
          SKLINT_SOURCE_COMMIT: ${{ inputs.release_ref }}
          SKLINT_SOURCE_DIRTY: "false"
        run: |
          set -euo pipefail
          python3 scripts/audit-rule-docs.py
          python3 scripts/audit-fix-coverage.py
          python3 scripts/audit-pydoclint-port.py
          cargo fmt --all -- --check
          cargo test --workspace --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo build --release --locked -p sklint

      - name: Enforce GLIBC ceiling and verify provenance
        id: verify
        shell: bash
        env:
          RELEASE_COMMIT: ${{ inputs.release_ref }}
          TREE_SHA: ${{ steps.source.outputs.tree_sha }}
        run: |
          set -euo pipefail

          bin="target/release/sklint"
          test -x "$bin"

          "$bin" --version --verbose | tee RELEASE_PROVENANCE.txt

          grep -Fxq "sklint 0.1.50" RELEASE_PROVENANCE.txt
          grep -Fxq "revision: v0.1.50" RELEASE_PROVENANCE.txt
          grep -Fxq "source-tree-sha256: $TREE_SHA" RELEASE_PROVENANCE.txt
          grep -Fxq "source-commit: $RELEASE_COMMIT" RELEASE_PROVENANCE.txt
          grep -Fxq "source-dirty: false" RELEASE_PROVENANCE.txt
          grep -Fxq "rustc: rustc 1.98.0 (88d9e12ae 2026-08-18)" RELEASE_PROVENANCE.txt
          grep -Fxq "target: ${{ matrix.rust_target }}" RELEASE_PROVENANCE.txt

          max_glibc="$(
            readelf --version-info "$bin" \
              | grep -oE 'GLIBC_[0-9]+(\.[0-9]+)*' \
              | sort -Vu \
              | tail -n1 || true
          )"

          test -n "$max_glibc"
          number="${max_glibc#GLIBC_}"

          if [[ "$(printf '%s\n%s\n' "$number" "2.35" | sort -V | head -n1)" != "$number" ]]; then
            echo "ERROR: release binary requires $max_glibc (> GLIBC_2.35)" >&2
            exit 1
          fi

          echo "max_glibc=$max_glibc" | tee GLIBC_STATE.txt
          echo "max_glibc=$max_glibc" >> "$GITHUB_OUTPUT"

      - name: Package portable Linux archive
        shell: bash
        run: |
          set -euo pipefail

          name="sklint-0.1.50-linux-${{ matrix.asset_arch }}"
          rm -rf release-stage
          mkdir -p "release-stage/$name"

          install -m 755 target/release/sklint "release-stage/$name/sklint"
          cp LICENSE README.md "release-stage/$name/"
          cp RELEASE_PROVENANCE.txt "release-stage/$name/PROVENANCE.txt"

          tar -C release-stage -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" | tee "SHA256SUMS-${{ matrix.asset_arch }}.txt"

      - name: Build Linux x64 VSIX
        if: matrix.build_vsix
        shell: bash
        env:
          SKLINT_BUILD_VERSION: "0.1.50"
          SKLINT_BUILD_REVISION: "v0.1.50"
          SKLINT_SOURCE_TREE_SHA256: ${{ steps.source.outputs.tree_sha }}
          SKLINT_SOURCE_COMMIT: ${{ inputs.release_ref }}
          SKLINT_SOURCE_DIRTY: "false"
        run: |
          set -euo pipefail

          (
            cd vscode
            npm ci
            npm run compile
          )

          python3 scripts/package-vscode.py

          src="dist/sklint-0.1.50.vsix"
          dst="sklint-0.1.50-vscode-linux-x64.vsix"

          test -f "$src"
          mv "$src" "$dst"

          unzip -p "$dst" extension/bin/linux-x64/sklint > /tmp/sklint-vsix
          chmod +x /tmp/sklint-vsix

          /tmp/sklint-vsix --version --verbose | tee VSIX_PROVENANCE.txt

          grep -Fxq "sklint 0.1.50" VSIX_PROVENANCE.txt
          grep -Fxq "revision: v0.1.50" VSIX_PROVENANCE.txt
          grep -Fxq "source-tree-sha256: ${{ steps.source.outputs.tree_sha }}" VSIX_PROVENANCE.txt
          grep -Fxq "source-commit: ${{ inputs.release_ref }}" VSIX_PROVENANCE.txt
          grep -Fxq "source-dirty: false" VSIX_PROVENANCE.txt
          grep -Fxq "target: x86_64-unknown-linux-gnu" VSIX_PROVENANCE.txt

          sha256sum "$dst" >> "SHA256SUMS-${{ matrix.asset_arch }}.txt"

      - name: Write release state
        shell: bash
        run: |
          set -euo pipefail

          cat > "RELEASE_STATE-${{ matrix.asset_arch }}.txt" <<EOF
          version=0.1.50
          revision=v0.1.50
          source_tree_sha256=${{ steps.source.outputs.tree_sha }}
          source_commit=${{ inputs.release_ref }}
          source_dirty=false
          rustc=$(rustc --version)
          target=${{ matrix.rust_target }}
          max_glibc=${{ steps.verify.outputs.max_glibc }}
          EOF

      - name: Upload Linux release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sklint-0.1.50-linux-${{ matrix.asset_arch }}
          if-no-files-found: error
          path: |
            sklint-0.1.50-linux-${{ matrix.asset_arch }}.tar.gz
            sklint-0.1.50-vscode-linux-x64.vsix
            RELEASE_STATE-${{ matrix.asset_arch }}.txt
            SHA256SUMS-${{ matrix.asset_arch }}.txt
            SOURCE_MANIFEST.txt
            SOURCE_TREE_SHA.txt
            RELEASE_PROVENANCE.txt
            VSIX_PROVENANCE.txt
            GLIBC_STATE.txt
